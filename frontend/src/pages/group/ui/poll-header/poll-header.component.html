@let activePoll = poll();
<header class="mb-6">
  <h1 class="mt-1 text-page-title font-semibold tracking-tight">
    {{ activePoll.title || 'Опрос #' + activePoll.sequenceNo }}
  </h1>
  <mat-chip-set class="mt-3" aria-label="Даты опроса">
    <mat-chip>
      {{ activePoll.startsOn | dateFormat: 'calendar-long' }}
    </mat-chip>
    <mat-chip>
      {{ activePoll.endsOn | dateFormat: 'calendar-long' }}
    </mat-chip>
  </mat-chip-set>
</header>
