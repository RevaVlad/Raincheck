<main
  class="mx-auto flex min-h-[calc(100dvh_-_3.5rem)] max-w-2xl flex-col justify-center px-5 py-10 sm:px-8"
>
  <section class="mb-7 text-center">
    <h1 class="text-page-title font-semibold tracking-tight">Создать группу</h1>
    <p class="mt-2 text-slate-600">
      У группы будет постоянная ссылка, а опрос можно будет повторить позже.
    </p>
  </section>

  <mat-card class="p-5 sm:p-7">
    <form [formGroup]="form" class="grid gap-x-4 gap-y-2 sm:grid-cols-2" (ngSubmit)="submit()">
      <mat-form-field class="sm:col-span-2">
        <mat-label>Название группы</mat-label>
        <input matInput formControlName="groupName" required maxlength="120" />
      </mat-form-field>
      <p class="-mb-1 text-supporting font-medium text-slate-700 sm:col-span-2">Первый опрос</p>
      <mat-form-field>
        <mat-label>Начало</mat-label>
        <input matInput type="date" formControlName="startsOn" required />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Конец</mat-label>
        <input matInput type="date" formControlName="endsOn" required />
      </mat-form-field>
      <p class="-mb-1 text-supporting font-medium text-slate-700 sm:col-span-2">Время (UTC)</p>
      <mat-form-field>
        <mat-label>Начало дня</mat-label>
        <input matInput type="time" formControlName="dayStart" required />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Конец дня</mat-label>
        <input matInput type="time" formControlName="dayEnd" required />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Шаг сетки</mat-label>
        <mat-select formControlName="slotMinutes" required>
          <mat-option value="30">30 минут</mat-option>
          <mat-option value="60">60 минут</mat-option>
        </mat-select>
      </mat-form-field>
      @if (errorMessage()) {
        <p class="text-supporting text-red-700 sm:col-span-2" role="alert">{{ errorMessage() }}</p>
      }
      <div class="flex items-end justify-end sm:col-start-2">
        <button mat-flat-button type="submit" [disabled]="submitting() || created()">
          {{ submitting() ? 'Создаём…' : 'Создать группу' }}
        </button>
      </div>
    </form>
  </mat-card>
</main>
