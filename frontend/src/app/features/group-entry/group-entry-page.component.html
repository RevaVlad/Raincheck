@if (joined()) {
  <app-workspace-page />
} @else {
  <main class="grid min-h-screen bg-slate-50 lg:grid-cols-[310px_minmax(0,1fr)]">
    <section class="border-r border-slate-200 bg-white p-5">
      <p class="text-sm font-semibold text-emerald-700">Raincheck</p>
      <span
        class="mt-7 inline-flex rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-medium text-emerald-700"
        >Активный опрос</span
      >
      <h2 class="mt-3 text-xl font-semibold">Встречи команды CRM</h2>
      <p class="mt-1 text-sm text-slate-500">6–12 октября · 16:00–23:00 UTC</p>
    </section>
    <section class="flex items-center justify-center p-5">
      <mat-card class="w-full max-w-md p-6 sm:p-8">
        <div class="text-center">
          <p class="text-3xl">👋</p>
          <h1 class="mt-4 text-2xl font-semibold">Присоединиться</h1>
          <p class="mt-2 text-sm text-slate-500">
            Представьтесь, чтобы отметить удобное время для команды.
          </p>
        </div>
        <mat-form-field class="mt-7 w-full"
          ><mat-label>Как вас зовут?</mat-label
          ><input matInput [(ngModel)]="displayName" placeholder="Например, Дима"
        /></mat-form-field>
        <button mat-flat-button class="mt-2 w-full" type="button" (click)="joined.set(true)">
          Продолжить к опросу
        </button>
      </mat-card>
    </section>
  </main>
}
