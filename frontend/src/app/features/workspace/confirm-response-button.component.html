<section class="mt-4 flex flex-wrap items-center justify-end gap-x-4 gap-y-2">
  <button
    mat-flat-button
    type="button"
    [disabled]="
      !editor.responseId() ||
      editor.saveState() === 'LOADING' ||
      editor.responseState() === 'CONFIRMED'
    "
    (click)="confirm()"
  >
    {{ editor.responseState() === 'CONFIRMED' ? 'Ответ подтверждён' : 'Подтвердить ответ' }}
  </button>
</section>
