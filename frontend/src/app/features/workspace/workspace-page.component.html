<main class="min-h-[calc(100dvh_-_3.5rem)] bg-slate-50 lg:grid lg:grid-cols-[310px_minmax(0,1fr)]">
  <app-group-sidebar
    [groupName]="workspace().group.name"
    [inviteLink]="inviteLink()"
    [inviteCode]="group.inviteCode()"
    [participants]="sidebarParticipants()"
    [polls]="workspace().polls"
  />
  <section class="min-w-0 p-5 sm:p-8">
    @if (currentPoll(); as poll) {
      <app-poll-header [poll]="poll" />
      <app-poll-entry-editor />
      <app-confirm-response-button [inviteCode]="group.inviteCode()" [pollId]="poll.id" />
    } @else {
      <section class="rounded-2xl border border-slate-200 bg-white p-6">
        <h1 class="text-page-title-compact font-semibold">Сейчас нет активного опроса</h1>
        <p class="mt-2 text-slate-600">
          Когда появится новый опрос, участники смогут отметить удобное время.
        </p>
      </section>
    }
  </section>
</main>
