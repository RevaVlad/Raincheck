<section class="mt-8">
  <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400">Текущий опрос</h3>
  <ul class="mt-3 space-y-1">
    @if (currentPoll(); as poll) {
      <li><app-poll-row [inviteCode]="inviteCode()" [poll]="poll" /></li>
    } @else {
      <li class="rounded-lg px-2 py-3 text-sm text-slate-500">Сейчас нет текущего опроса.</li>
    }
  </ul>
</section>

<section class="mt-6">
  <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400">Прошедшие опросы</h3>
  <ul class="mt-3 max-h-64 space-y-1 overflow-y-auto">
    @for (poll of pastPolls(); track poll.id) {
      <li><app-poll-row [inviteCode]="inviteCode()" [poll]="poll" /></li>
    } @empty {
      <li class="rounded-lg px-2 py-3 text-sm text-slate-500 border border-slate-200">Пока нет прошедших опросов.</li>
    }
  </ul>
</section>
