<aside class="flex h-full min-w-0 flex-col border-r border-slate-200 bg-white p-5">
  <h2 class="mt-3 text-xl font-semibold tracking-tight">{{ groupName() }}</h2>
  <section class="mt-8 min-w-0 overflow-hidden">
    <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400">Ссылка для команды</h3>
    <app-invite-link [inviteLink]="inviteLink()" />
  </section>

  <section class="mt-8">
    <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400">
      Участники ({{ participants().length }})
    </h3>
    <app-group-participant-list
      [participants]="participants()"
      [inviteCode]="inviteCode()"
      [currentParticipantId]="currentParticipantId()"
      [showStatuses]="showParticipantStatuses()"
    />
  </section>

  <app-poll-list
    class="block border-t border-slate-200 mt-8"
    [inviteCode]="inviteCode()"
    [polls]="polls()"
  />
</aside>
