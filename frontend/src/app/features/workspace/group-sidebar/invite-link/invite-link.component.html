<mat-card class="mt-3 flex min-w-0 flex-row items-center gap-2 overflow-hidden p-2">
  <a class="min-w-0 flex-1 truncate px-2 text-xs text-slate-700" [href]="inviteLink()">
    {{ inviteLink() }}
  </a>
  <button mat-icon-button aria-label="Скопировать ссылку" type="button" (click)="copyInvite()">
    <img class="size-5" src="/copy.png" alt="" />
  </button>
</mat-card>
@if (copied()) {
  <p class="mt-2 text-xs text-emerald-700" role="status">Ссылка скопирована</p>
}
