<div
  class="flex flex-row items-center justify-between gap-3 border-b border-slate-200 bg-white px-4 py-3"
>
  <mat-button-toggle-group
    [value]="selectedKind()"
    (change)="selectKind.emit($event.value)"
    aria-label="Отметить доступность"
  >
    <mat-button-toggle value="UNAVAILABLE">Не могу</mat-button-toggle>
    <mat-button-toggle value="IF_NEEDED">Если понадобится</mat-button-toggle>
    <mat-button-toggle value="PREFERRED">Удобно</mat-button-toggle>
    <mat-button-toggle value="CLEAR">Очистить</mat-button-toggle>
  </mat-button-toggle-group>
  <span class="text-caption text-slate-500" role="status" aria-live="polite">
    {{ saveLabel() }}
  </span>
</div>
