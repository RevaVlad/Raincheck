<mat-card class="overflow-hidden">

  <app-availability-grid [selectedKind]="editor.selectedKind()" />
  <div class="flex items-center border-t border-slate-200 px-4 py-3">
    <span class="text-sm text-slate-500">Выбрано: {{ editor.label() }}</span>

  </div>
</mat-card>
