<mat-card class="overflow-hidden">
  <app-availability-toolbar [selectedKind]="editor.selectedKind()" (selectKind)="select($event)" />
  @if (editor.saveState() === 'LOADING') {
    <app-loading-state layout="editor" statusText="Загружаем ваш ответ…" />
  } @else if (editor.responseLoaded()) {
    <app-availability-grid [selectedKind]="editor.selectedKind()" />
  } @else {
    <app-error-state
      class="mx-6 my-4"
      [message]="editor.lastSaveError() || 'Не удалось загрузить ответ.'"
      retryLabel="Повторить загрузку"
      (retry)="retryLoad()"
    />
  }
  <div class="flex flex-wrap items-center gap-3 border-t border-slate-200 px-4 py-3">
    <span class="ml-auto flex gap-2">
      @if (editor.saveState() === 'ERROR' && editor.responseLoaded()) {
        <button mat-button type="button" (click)="retrySave()">Повторить сохранение</button>
      }
      <button
        mat-flat-button
        type="button"
        [disabled]="
          !editor.responseId() ||
          editor.saveState() === 'LOADING' ||
          editor.responseState() === 'CONFIRMED'
        "
        (click)="confirm()"
      >
        {{ editor.responseState() === 'CONFIRMED' ? 'Подтверждено' : 'Готово' }}
      </button>
    </span>
  </div>
</mat-card>
