<div class="overflow-x-auto bg-white">
  <div
    class="schedule-grid min-w-[760px]"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerCancel($event)"
    (lostpointercapture)="onPointerCancel($event)"
  >
    <div class="corner"></div>
    @for (day of days(); track day.localDate) {
      <div class="day">
        <strong>{{ day.weekday }}</strong
        ><span>{{ day.date }}</span>
      </div>
    }
    @for (slot of slots(); track slot.time) {
      <div class="time">{{ displayTime(days()[0]?.localDate ?? '', slot.time) }}</div>
      @for (day of days(); track day.localDate) {
        @let kind = state(day.localDate, slot.time);
        <div
          class="cell"
          [attr.data-date]="day.localDate"
          [attr.data-time]="slot.time"
          [attr.title]="displayTime(day.localDate, slot.time)"
          role="gridcell"
          [attr.aria-label]="
            day.weekday + ' ' + displayTime(day.localDate, slot.time) + ': ' + (kind ?? 'нейтрально')
          "
          [class.unavailable]="kind === 'UNAVAILABLE'"
          [class.if-needed]="kind === 'IF_NEEDED'"
          [class.preferred]="kind === 'PREFERRED'"
        ></div>
      }
    }
  </div>
</div>
