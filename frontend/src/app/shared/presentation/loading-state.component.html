<div aria-busy="true">
  <p class="sr-only" role="status" aria-live="polite">{{ statusText() }}</p>
  @switch (layout()) {
    @case ('group') {
      <div
        class="grid min-h-[calc(100dvh_-_3.5rem)] bg-background lg:grid-cols-[310px_minmax(0,1fr)]"
        aria-hidden="true"
      >
        <aside class="border-r border-border bg-surface p-5">
          <div
            class="h-5 w-24 animate-pulse rounded-full bg-skeleton motion-reduce:animate-none"
          ></div>
          <div
            class="mt-5 h-7 w-4/5 animate-pulse rounded bg-skeleton motion-reduce:animate-none"
          ></div>
          <div
            class="mt-3 h-4 w-full animate-pulse rounded bg-surface-muted motion-reduce:animate-none"
          ></div>
          <div
            class="mt-10 h-4 w-2/5 animate-pulse rounded bg-skeleton motion-reduce:animate-none"
          ></div>
          <div
            class="mt-3 h-11 animate-pulse rounded-xl bg-surface-muted motion-reduce:animate-none"
          ></div>
          <div
            class="mt-10 h-4 w-1/3 animate-pulse rounded bg-skeleton motion-reduce:animate-none"
          ></div>
          <div class="mt-3 space-y-3 rounded-xl border border-border bg-surface p-3">
            <div class="h-9 animate-pulse rounded-lg bg-surface-muted motion-reduce:animate-none"></div>
            <div class="h-9 animate-pulse rounded-lg bg-surface-muted motion-reduce:animate-none"></div>
            <div class="h-9 animate-pulse rounded-lg bg-surface-muted motion-reduce:animate-none"></div>
          </div>
        </aside>
        <section class="grid place-items-center p-5">
          <div class="w-full max-w-md rounded-2xl border border-border bg-surface p-7">
            <div
              class="mx-auto h-8 w-8 animate-pulse rounded-full bg-accent-soft motion-reduce:animate-none"
            ></div>
            <div
              class="mx-auto mt-5 h-7 w-3/5 animate-pulse rounded bg-skeleton motion-reduce:animate-none"
            ></div>
            <div
              class="mx-auto mt-3 h-4 w-4/5 animate-pulse rounded bg-surface-muted motion-reduce:animate-none"
            ></div>
            <div
              class="mt-8 h-11 animate-pulse rounded-lg bg-surface-muted motion-reduce:animate-none"
            ></div>
            <div
              class="mt-3 h-11 animate-pulse rounded-lg bg-surface-muted motion-reduce:animate-none"
            ></div>
          </div>
        </section>
      </div>
    }
    @case ('results') {
      <div class="space-y-8" aria-hidden="true">
        <div class="grid grid-cols-3 gap-3">
          <div class="h-20 animate-pulse rounded-xl bg-surface motion-reduce:animate-none"></div>
          <div class="h-20 animate-pulse rounded-xl bg-surface motion-reduce:animate-none"></div>
          <div class="h-20 animate-pulse rounded-xl bg-surface motion-reduce:animate-none"></div>
        </div>
        <section class="space-y-3">
          <div class="h-7 w-44 animate-pulse rounded bg-skeleton motion-reduce:animate-none"></div>
          <div class="h-14 animate-pulse rounded-xl bg-surface motion-reduce:animate-none"></div>
          <div class="h-14 animate-pulse rounded-xl bg-surface motion-reduce:animate-none"></div>
          <div class="h-14 animate-pulse rounded-xl bg-surface motion-reduce:animate-none"></div>
        </section>
        <div
          class="h-64 animate-pulse rounded-xl border border-border bg-surface motion-reduce:animate-none"
        ></div>
      </div>
    }
    @case ('editor') {
      <div class="space-y-4" aria-hidden="true">
        <div class="flex gap-2 border-b border-border pb-3">
          <div
            class="h-9 w-24 animate-pulse rounded-lg bg-surface-muted motion-reduce:animate-none"
          ></div>
          <div
            class="h-9 w-32 animate-pulse rounded-lg bg-surface-muted motion-reduce:animate-none"
          ></div>
          <div
            class="h-9 w-24 animate-pulse rounded-lg bg-surface-muted motion-reduce:animate-none"
          ></div>
        </div>
        <div class="grid grid-cols-5 gap-px overflow-hidden rounded-lg bg-border">
          @for (row of [1, 2, 3, 4, 5]; track row) {
            @for (cell of [1, 2, 3, 4, 5]; track cell) {
              <div class="h-10 animate-pulse bg-surface-muted motion-reduce:animate-none"></div>
            }
          }
        </div>
        <div class="h-10 animate-pulse rounded-lg bg-surface-muted motion-reduce:animate-none"></div>
      </div>
    }
  }
</div>
