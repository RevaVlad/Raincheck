<section class="rounded-xl bg-white p-6" role="alert" aria-live="assertive">
  <p class="text-sm text-red-700">{{ message() }}</p>
  @if (retryLabel(); as label) {
    <button
      class="mt-4 text-sm font-medium text-emerald-700 underline"
      type="button"
      (click)="retry.emit()"
    >
      {{ label }}
    </button>
  }
</section>
