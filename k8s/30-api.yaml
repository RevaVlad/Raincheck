apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: raincheck
spec:
  replicas: 2
  minReadySeconds: 20
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
        cpu-limit-cores: &api_cpu_limit_cores "0.5"
    spec:
      containers:
        - name: api
          image: raincheck-api:v1
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: *api_cpu_limit_cores
              memory: 384Mi
          ports:
            - containerPort: 3000
            - name: metrics
              containerPort: 9464
          startupProbe:
            httpGet:
              path: /health/live
              port: 3000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
          env:
            - name: APP_VERSION
              value: v1
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: raincheck-env
                  key: K8S_DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: raincheck
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
