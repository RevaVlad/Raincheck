apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: raincheck
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      component: database
  template:
    metadata:
      labels:
        app: postgres
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "raincheck", "-d", "raincheck"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "raincheck", "-d", "raincheck"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "raincheck", "-d", "raincheck"]
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          env:
            - name: POSTGRES_DB
              value: raincheck
            - name: POSTGRES_USER
              value: raincheck
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: raincheck-env
                  key: POSTGRES_PASSWORD
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: raincheck
spec:
  clusterIP: None
  selector:
    app: postgres
    component: database
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: raincheck
spec:
  type: ClusterIP
  selector:
    app: postgres
    component: database
  ports:
    - port: 5432
      targetPort: 5432
