apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: raincheck
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      component: database
  template:
    metadata:
      labels:
        app: postgres
        component: database
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "raincheck", "-d", "raincheck"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "raincheck", "-d", "raincheck"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "raincheck", "-d", "raincheck"]
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          env:
            - name: POSTGRES_DB
              value: raincheck
            - name: POSTGRES_USER
              value: raincheck
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: raincheck-env
                  key: POSTGRES_PASSWORD
      initContainers:
        - name: postgres-exporter
          image: docker.io/prometheuscommunity/postgres-exporter:v0.18.1
          restartPolicy: Always
          imagePullPolicy: IfNotPresent

          ports:
            - name: metrics
              containerPort: 9187
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 5
          env:
            - name: DATA_SOURCE_URI
              value: "127.0.0.1:5432/raincheck?sslmode=disable"
            - name: DATA_SOURCE_USER
              value: raincheck
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: raincheck-env
                  key: POSTGRES_PASSWORD
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: raincheck
spec:
  clusterIP: None
  selector:
    app: postgres
    component: database
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: raincheck
spec:
  type: ClusterIP
  selector:
    app: postgres
    component: database
  ports:
    - port: 5432
      targetPort: 5432
