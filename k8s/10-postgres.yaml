apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: raincheck
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: raincheck
            - name: POSTGRES_USER
              value: raincheck
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: raincheck-env
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: raincheck
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
