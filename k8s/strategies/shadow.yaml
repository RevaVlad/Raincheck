apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: raincheck
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/version
          method: GET
      backendRefs:
        - name: api
          port: 3000
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: api-v2
              port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 3000
