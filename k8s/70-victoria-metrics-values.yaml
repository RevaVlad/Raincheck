server:
  scrape:
    enabled: false
  extraArgs:
    vmui.customDashboardsPath: /etc/victoria-metrics/dashboards
  extraVolumes:
    - name: vmui-dashboards
      configMap:
        name: raincheck-vmui-dashboards
  extraVolumeMounts:
    - name: vmui-dashboards
      mountPath: /etc/victoria-metrics/dashboards
      readOnly: true

service:
  enabled: true

remoteWrite:
  - url: http://vm-single-victoria-metrics-single-server:8428/api/v1/write

config:
  global:
    scrape_interval: 15s
  scrape_configs:
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: 'true'
        - source_labels:
            - __meta_kubernetes_pod_annotation_prometheus_io_port
            - __meta_kubernetes_pod_container_port_number
          action: keep_if_equal
